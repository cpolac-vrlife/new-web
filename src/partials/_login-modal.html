<!-- Login Modal Overlay -->
<div class="login-modal-overlay" id="login-modal-overlay" style="display:none">
  <div class="login-modal" role="dialog" aria-modal="true" aria-labelledby="login-modal-title">
    <button class="login-modal__close" id="login-modal-close" aria-label="Close">
      <span class="material-symbols-outlined">close</span>
    </button>
    <div class="login-modal__header">
      
      <h2 class="login-modal__title" id="login-modal-title">Welcome Back</h2>
    </div>
    <form class="login-modal__form" id="login-modal-form" autocomplete="off">
      <div class="login-modal__field">
        <label class="login-modal__label" for="login-email">Email / Username</label>
        <input class="login-modal__input" type="text" id="login-email" name="email" placeholder="Enter your email or username" autocomplete="username" />
      </div>
      <div class="login-modal__field">
        <label class="login-modal__label" for="login-password">Password</label>
        <div class="login-modal__password-wrapper">
          <input class="login-modal__input" type="password" id="login-password" name="password" placeholder="Enter your password" autocomplete="current-password" />
          <button type="button" class="login-modal__toggle-password" id="toggle-password" aria-label="Toggle password visibility">
            <span class="material-symbols-outlined">visibility_off</span>
          </button>
        </div>
      </div>
      <div class="login-modal__remember">
        <label class="login-modal__checkbox-label">
          <input type="checkbox" name="remember" />
          <span>Remember me</span>
        </label>
      </div>
      <button type="submit" class="login-modal__submit">SIGN IN</button>
    </form>
    <div class="login-modal__footer">
      <a href="#" class="login-modal__link" id="forgot-password-link">Forgot Password?</a>
      <a href="/join.html" class="login-modal__link login-modal__link--join">JOIN US</a>
    </div>

    <!-- Forgot Password View -->
    <div class="login-modal__forgot" id="forgot-password-view">
      <div class="login-modal__forgot-icon">
        <span class="material-symbols-outlined">lock_reset</span>
      </div>
      <h2 class="login-modal__title">Reset your password</h2>
      <p class="login-modal__forgot-text">Enter the email address associated with your account and we'll send you a link to reset your password.</p>
      <form class="login-modal__form" id="forgot-password-form" autocomplete="off">
        <div class="login-modal__field">
          <label class="login-modal__label" for="forgot-email">Email</label>
          <input class="login-modal__input" type="email" id="forgot-email" name="email" placeholder="Enter your email address" autocomplete="email" />
        </div>
        <button type="submit" class="login-modal__submit">RESET PASSWORD</button>
      </form>
      <button type="button" class="login-modal__back" id="back-to-login">
        <span class="material-symbols-outlined">arrow_back</span>
        Back to Sign In
      </button>
    </div>
  </div>
</div>
