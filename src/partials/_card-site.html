<div class="card-site">
  <div class="card-site__left">
    <div class="card-site__logo">
      <img src="{{siteLogo}}" alt="{{siteName}}" loading="lazy" width="150" />
    </div>
    <p class="card-site__desc">{{siteDescription}}</p>
    <a href="{{siteUrl}}" class="btn btn-custom {{siteBtnClass}}" target="_blank" rel="noopener">obtener <span>{{siteBtnSpan}}</span></a>
  </div>
  <div class="card-site__right">
    <a href="{{video1Url}}" class="card-site__video" target="_blank" rel="noopener">
      {{video1Badge}}
      <div class="card-site__video-thumb">
        <img src="{{video1Poster}}" alt="{{video1Title}}" loading="lazy" width="280" height="158" />
      </div>
      <div class="card-site__video-info">
        <h4>{{video1Title}}</h4>
        <p>{{video1Performers}}</p>
      </div>
    </a>
    <a href="{{video2Url}}" class="card-site__video" target="_blank" rel="noopener">
      {{video2Badge}}
      <div class="card-site__video-thumb">
        <img src="{{video2Poster}}" alt="{{video2Title}}" loading="lazy" width="280" height="158" />
      </div>
      <div class="card-site__video-info">
        <h4>{{video2Title}}</h4>
        <p>{{video2Performers}}</p>
      </div>
    </a>
  </div>
</div>
