<div class="card-model">
  <a href="{{modelUrl}}" class="card-model__link">
    <div class="card-model__image-wrapper">
      <img src="{{modelImage}}" alt="{{modelName}}" class="card-model__image" loading="lazy" decoding="async" width="300" height="300">
      <button class="card-model__favorite" aria-label="Add to favorites">
        <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px" fill="#fff">
          <path d="m480-120-58-52q-101-91-167-157T150-447.5Q111-500 95.5-544T80-634q0-94 63-157t157-63q52 0 99 22t81 62q34-40 81-62t99-22q94 0 157 63t63 157q0 46-15.5 90T810-447.5Q771-395 705-329T538-172l-58 52Z"/>
        </svg>
      </button>
    </div>
    <div class="card-model__info">
      <h3 class="card-model__name">{{modelName}}</h3>
      <span class="card-model__videos">{{videoCount}} videos</span>
    </div>
  </a>
</div>
