<div class="card card-series">
    <a href="{{seriesUrl}}" class="card-link" data-series-id="{{seriesId}}" data-series-url="{{seriesUrl}}" target="_blank" rel="noopener">
        <div class="card-series__image-container">
            <div class="card-series__background">
                <img src="/images/series/{{seriesSlug}}/serie_back.jpg" alt="{{seriesName}} background" loading="lazy">
            </div>
            <div class="card-series__pornstar">
                <img src="/images/series/{{seriesSlug}}/serie_pornstar.png" alt="{{mainActress}}" loading="lazy">
            </div>
            <div class="card-series__logo">
                <img src="/images/series/{{seriesSlug}}/serie-logo.png" alt="{{seriesName}} logo" loading="lazy">
            </div>
        </div>
    </a>
    <div class="data-video">
        <div class="data-left">
            <h3>{{seriesName}} - {{episodeCount}} episodes</h3>
            <div class="cast">{{mainActress}}</div>
        </div>
        <div class="data-right">
            <div class="badge-series">
                <svg class="badge-series__logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 75.4">
                    <path d="M132,37.7C132,16.9,115.1,0,94.3,0h-56.6C16.9,0,0,16.8,0,37.7s16.9,37.7,37.7,37.7h56.6c20.8,0,37.7-16.9,37.7-37.7h0ZM122.6,37.7c0,15.6-12.7,28.3-28.3,28.3h-56.6c-15.6,0-28.3-12.7-28.3-28.3s12.7-28.3,28.3-28.3h56.6c15.6,0,28.3,12.7,28.3,28.3h0Z" fill="#ffffff"/>
                    <path class="badge-series__heart" d="M89.3,34.6c1.3-1.3,1.3-3.4,0-4.7l-10.1-10.1c-1.3-1.3-3.4-1.3-4.7,0l-8.5,8.5-8.5-8.5c-1.3-1.3-3.4-1.3-4.7,0l-10.1,10.1c-1.3,1.3-1.3,3.4,0,4.7l21,21c.5.5,1.1.8,1.7.9,1,.2,2.2,0,3-.9l20.9-21h0Z" fill="#ffffff"/>
                </svg>
                <div class="badge-series__label"><span>SERIES</span></div>
            </div>
        </div>
    </div>    
</div>
